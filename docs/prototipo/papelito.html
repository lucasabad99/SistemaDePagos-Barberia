<title>Papelito Barbería</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: admin = barra lateral azul marino + contenido claro (en celu la barra es un cajón). Barbero = columna de celular con pestañas abajo. Cliente = tarjeta de socio con QR. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6B80; --line:#DDE3EA;
  --gold:#1D4ED8; --on-gold:#FFFFFF; --gold-soft:#E6EDFC;
  --side:#0B1F3A; --side-2:#13294A; --side-ink:#E8EEF7; --side-muted:#8DA0BA; --side-gold:#7FB2FF;
  --ok:#0F7A55; --ok-soft:#E1F3EC; --warn:#A15C07; --warn-soft:#FCF0DC; --bad:#C0262D; --bad-soft:#FCE6E7; --blue:#0E7490; --blue-soft:#E0F2F5;
  --c1:#1D4ED8; --c2:#10A37F; --c3:#0891B2; --c4:#64748B; --c5:#F59E0B;
  --shadow:0 1px 2px rgba(15,27,45,.06);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2B; --ink:#E6ECF5; --muted:#93A3B8; --line:#23314A;
  --gold:#6EA0FF; --on-gold:#0B1220; --gold-soft:#16264A;
  --side:#070E1A; --side-2:#10203A;
  --ok:#3DD39B; --ok-soft:#0F2E24; --warn:#F5B44A; --warn-soft:#33260F; --bad:#F87171; --bad-soft:#3A1719; --blue:#2CC6D9; --blue-soft:#0F2E36;
  --c1:#6EA0FF; --c2:#34D399; --c3:#22D3EE; --c4:#94A3B8; --c5:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2B; --ink:#E6ECF5; --muted:#93A3B8; --line:#23314A;
  --gold:#6EA0FF; --on-gold:#0B1220; --gold-soft:#16264A;
  --side:#070E1A; --side-2:#10203A;
  --ok:#3DD39B; --ok-soft:#0F2E24; --warn:#F5B44A; --warn-soft:#33260F; --bad:#F87171; --bad-soft:#3A1719; --blue:#2CC6D9; --blue-soft:#0F2E36;
  --c1:#6EA0FF; --c2:#34D399; --c3:#22D3EE; --c4:#94A3B8; --c5:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num,.mono{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.small{font-size:13px;color:var(--muted)}
.demo{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:7px 11px;border-radius:8px}

/* ---------- Login ---------- */
.login{min-height:100%;background:linear-gradient(160deg,#0B1F3A 0%,#0E2A50 60%,#123766 100%);color:#E8EEF7;display:flex;align-items:center;justify-content:center;
  padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.logo svg{width:64px;height:64px;color:#7FB2FF}
.logo b{font-size:28px;letter-spacing:-.01em}
.logo span{font-size:14px;color:#93A3B8}
.lfield{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 14px}
.lfield svg{width:18px;height:18px;color:#93A3B8;flex:none}
.lfield div{flex:1;display:flex;flex-direction:column}
.lfield label{font-size:12px;color:#93A3B8}
.lfield input{background:none;border:0;color:#E8EEF7;font:inherit;padding:0;outline:none;width:100%}
.lbtn{background:#2563EB;color:#FFFFFF;border:0;border-radius:8px;padding:14px;font-weight:700;font-size:16px}
.lerr{color:#F4A39A;font-size:13px;text-align:center;min-height:18px}
.quick{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.quick p{margin:0;font-size:12px;color:#93A3B8;text-align:center}
.quick .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.quick button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#E8EEF7;border-radius:999px;padding:6px 12px;font-size:13px}
.quick button b{color:#7FB2FF;font-weight:600}
.linkbtn{background:none;border:0;color:#7FB2FF;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* ---------- Admin shell ---------- */
.shell{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .brand svg{width:34px;height:34px;color:var(--side-gold);flex:none}
.side .brand b{display:block;font-size:16px;line-height:1.1}
.side .brand span{font-size:12px;color:var(--side-gold)}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:9px;font-size:14px;text-align:left;opacity:.82}
.side nav button svg{width:18px;height:18px;flex:none}
.side nav button:hover{background:var(--side-2);opacity:1}
.side nav button[aria-current="page"]{background:rgba(127,178,255,.16);color:#fff;opacity:1;box-shadow:inset 2px 0 0 var(--side-gold)}
.side nav .badge{margin-left:auto;background:var(--side-gold);color:#0B1F3A;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:18px}
.side .me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:10px}
.side .me .grow{flex:1;min-width:0}
.side .me small{display:block;color:var(--side-muted);font-size:12px}
.side .me button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:8px;padding:4px 10px;font-size:12.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.side .avatar{background:#1E3A64;color:var(--side-gold)}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.admin::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.bar .burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;place-items:center}
.bar .burger svg{width:20px;height:20px}
.bar .grow{flex:1;min-width:0}
.bar .date{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;white-space:nowrap;text-transform:capitalize}
.content{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
@media (min-width:900px){.content{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.drawer-scrim{display:none}
@media (max-width:899px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:45;transform:translateX(-102%);transition:transform .2s ease}
  .side.open{transform:none}
  .drawer-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
  .bar .burger{display:grid}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head > div{min-width:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.card-h .ic svg{width:17px;height:17px}
.card-h .t{display:flex;align-items:center;gap:10px;min-width:0}
.kpi{gap:6px}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.ic.gold{background:var(--gold-soft);color:var(--gold)} .ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.blue{background:var(--blue-soft);color:var(--blue)} .ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.mute{background:var(--bg);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:9px;padding:15px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:16.5px}
.big:disabled{opacity:.4}
.big svg{width:20px;height:20px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.blue{background:var(--blue-soft);color:var(--blue)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.mute{background:var(--bg);color:var(--muted)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:600}
.li .r{text-align:right;white-space:nowrap}
.amt{font-family:var(--f-mono);font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:14px}
.ledger .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ledger .tot{border-top:1px solid var(--line);padding-top:7px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.meter{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--gold);border-radius:4px}
.meter.low i{background:var(--bad)}
.note{font-size:13.5px;line-height:1.55;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note b{color:var(--ink)}
.note ul{margin:6px 0 0;padding-left:18px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-size:16px;text-transform:capitalize;min-width:130px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutwrap svg{width:140px;height:140px;flex:none}
.donutwrap .legend{flex-direction:column;flex:1;min-width:140px}
.donutwrap .legend div{display:flex;justify-content:space-between;gap:10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars i{flex:1;background:var(--gold);opacity:.55;border-radius:2px 2px 0 0;min-height:2px}
.bars i.on{opacity:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.search{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;width:100%;max-width:320px}

/* Papelito */
.tickets{display:flex;flex-direction:column;gap:8px}
.ticket{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:62px}
.stub{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed var(--line);position:relative;padding:6px 4px}
.stub::before,.stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-8px;clip-path:inset(50% 0 0 0)}
.stub::after{bottom:-8px;clip-path:inset(0 0 50% 0)}
.stub .n{font-family:var(--f-mono);font-weight:600;font-size:15px}
.stub .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tbody{flex:1;min-width:0;padding:8px 12px 8px 14px;display:flex;align-items:center;gap:10px}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.tmain .w{font-weight:600;overflow-wrap:anywhere}
.tmain .meta{font-size:12.5px;color:var(--muted)}
.ticket.tap{cursor:pointer}
.ticket.tap:hover{border-color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.ef{background:var(--ok)} .dot.tr{background:var(--blue)} .dot.mb{background:var(--gold)}

/* ---------- Barbero app ---------- */
.phone{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
@media (min-width:520px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--side);color:var(--side-ink);display:flex;align-items:center;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.barbero::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--side)}
.ptop svg.lg{width:28px;height:28px;color:var(--side-gold);flex:none}
.ptop .grow{flex:1;min-width:0}
.ptop b{display:block;font-size:15px}
.ptop small{color:var(--side-gold);font-size:12px}
.ptop button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:8px;padding:5px 11px;font-size:13px}
.pcontent{flex:1;padding-block:16px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .l{font-size:12px;color:var(--muted)}
.stat.hot{border-color:var(--warn);background:var(--warn-soft)} .stat.hot .v{color:var(--warn)}
.stat.gold{border-color:var(--gold);background:var(--gold-soft)} .stat.gold .v{color:var(--gold)}
.ptabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ptabs .in{display:flex;width:100%;max-width:480px}
.ptabs button{flex:1;border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.ptabs button svg{width:22px;height:22px}
.ptabs button[aria-current="page"]{color:var(--ink)}
.ptabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Cliente ---------- */
.clientp{min-height:100%;background:linear-gradient(160deg,#0B1F3A 0%,#0E2A50 60%,#123766 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.membercard{width:100%;max-width:360px;border-radius:16px;padding:22px;background:linear-gradient(150deg,#1A4A8C 0%,#0E2A50 55%,#0B1F3A 100%);border:1px solid rgba(127,178,255,.35);color:#E8EEF7;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.membercard .top{display:flex;justify-content:space-between;align-items:center}

/* ---------- Datos de ejemplo ---------- */
function seed(){
  const now=new Date();
  const rnd=mulberry32(2026);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const settings={negocio:'Barbería Darwin',recargoPct:10,comisionProducto:10,topeAnual:120000000};
  const servicios=[{id:'corte',nombre:'Corte',precio:18000},{id:'barba',nombre:'Barba',precio:10000},{id:'cb',nombre:'Corte + barba',precio:25000}];
  const productos=[
    {id:'p1',nombre:'Cera mate',precio:12000,costo:6000,stock:14,min:5},
    {id:'p2',nombre:'Shampoo anticaspa',precio:15000,costo:7500,stock:4,min:5},
    {id:'p3',nombre:'Aceite para barba',precio:14000,costo:6500,stock:9,min:4},
    {id:'p4',nombre:'Pomada brillo',precio:11000,costo:5000,stock:3,min:4}];
  const planes=[{id:'pl1',nombre:'Socio Corte',precio:60000,usos:4,servicioId:'corte'},{id:'pl2',nombre:'Socio Full',precio:85000,usos:4,servicioId:'cb'}];
  const usuarios=[
    {id:'u0',nombre:'Darwin',rol:'admin',usuario:'darwin',pin:'1234',comision:100,activo:true},
    {id:'u1',nombre:'Matías',rol:'barbero',usuario:'matias',pin:'1111',comision:50,activo:true},
    {id:'u2',nombre:'Nico',rol:'barbero',usuario:'nico',pin:'2222',comision:50,activo:true},
    {id:'u3',nombre:'Leo',rol:'barbero',usuario:'leo',pin:'3333',comision:45,activo:true}];
  const nombres=['Pablo Gómez','Juan Pérez','Lucas Díaz','Martín Sosa','Santiago Ríos','Tomás Herrera','Facundo Ibarra','Diego Molina','Joaquín Vera','Agustín Paz','Ezequiel Luna','Bruno Acosta','Gonzalo Ruiz','Franco Benítez','Iván Correa','Ramiro Ponce'];
  const clientes=nombres.map((n,i)=>{
    const socio=i<8;
    const pl=socio?(i%3===0?planes[1]:planes[0]):null;
    return {id:'c'+i,nombre:n,tel:'11 '+(2000+Math.floor(rnd()*7999))+'-'+(1000+Math.floor(rnd()*8999)),codigo:'SOC-'+(1040+i*7),
      planId:pl?pl.id:null,usos:pl?Math.floor(rnd()*(pl.usos+1)):0,vence:pl?new Date(now.getTime()+(3+Math.floor(rnd()*25))*864e5).toISOString():null,
      alta:new Date(now.getTime()-(30+Math.floor(rnd()*200))*864e5).toISOString()};
  });
  const socios=clientes.filter(c=>c.planId);
  const ventas=[];
  const start=new Date(now.getFullYear(),now.getMonth()-2,1);
  const today=dayKey(now);
  for(let d=new Date(start);dayKey(d)<=today;d.setDate(d.getDate()+1)){
    if(d.getDay()===0)continue;
    const isToday=dayKey(d)===today;
    if(d.getDate()<=5&&!isToday){ // venta de planes a principio de mes
      socios.filter((c,i)=>(i+d.getDate())%5===0).forEach(c=>{
        const pl=planes.find(p=>p.id===c.planId);const tr=rnd()<0.6;
        ventas.push({id:uid(),fecha:new Date(d.getFullYear(),d.getMonth(),d.getDate(),11,Math.floor(rnd()*59)).toISOString(),barberoId:'u0',clienteId:c.id,
          items:[{tipo:'plan',refId:pl.id,nombre:'Plan '+pl.nombre,precio:pl.precio,cant:1}],metodo:tr?'transferencia':'efectivo',
          recargo:tr?Math.round(pl.precio*settings.recargoPct/100):0,estado:tr?'verificado':'entregado',comision:0});
      });
    }
    for(const u of usuarios){
      const n=u.rol==='admin'?1+Math.floor(rnd()*3):(isToday?2+Math.floor(rnd()*3):3+Math.floor(rnd()*4));
      for(let i=0;i<n;i++){
        let f;
        if(isToday){const sod=new Date(now);sod.setHours(9,0,0,0);f=new Date(Math.max(sod.getTime()+60e3,now.getTime()-Math.floor(rnd()*6*3600e3)-60e3))}
        else f=new Date(d.getFullYear(),d.getMonth(),d.getDate(),10+Math.floor(rnd()*10),Math.floor(rnd()*60));
        const r=rnd();const svc=r<0.5?servicios[0]:r<0.68?servicios[1]:servicios[2];
        let cliente=null,cub=false;
        if(rnd()<0.25){const c=pick(socios);const pl=planes.find(p=>p.id===c.planId);cliente=c;cub=pl.servicioId===svc.id}
        else if(rnd()<0.3)cliente=pick(clientes);
        const items=[{tipo:'servicio',refId:svc.id,nombre:svc.nombre,precio:svc.precio,cant:1,cubierto:cub}];
        if(rnd()<0.15){const p=pick(productos);items.push({tipo:'producto',refId:p.id,nombre:p.nombre,precio:p.precio,cant:1})}
        const base=sum(items.filter(x=>!x.cubierto),x=>x.precio*x.cant);
        const tr=base>0&&rnd()<0.45;
        const ago=(now-f)/864e5;
        let estado,entregadoEn=null;
        if(base===0)estado='cubierto';
        else if(tr)estado=(isToday&&rnd()<0.5)?'pendiente':'verificado';
        else if(u.rol==='admin'){estado='entregado';entregadoEn=f.toISOString()}
        else if(isToday){if(rnd()<0.15){estado='entregado';entregadoEn=new Date(Math.min(now.getTime(),f.getTime()+3600e3)).toISOString()}else estado='en_barbero'}
        else{estado='entregado';const e=new Date(f);e.setHours(20,30,0,0);entregadoEn=e.toISOString()}
        ventas.push({id:uid(),fecha:f.toISOString(),barberoId:u.id,clienteId:cliente?cliente.id:null,items,metodo:base===0?'membresia':tr?'transferencia':'efectivo',
          recargo:tr?Math.round(base*settings.recargoPct/100):0,estado,entregadoEn,comision:calcComision(items,u.comision,settings.comisionProducto,u.rol)});
      }
    }
  }
  ventas.sort((a,b)=>a.fecha<b.fecha?-1:1);
  ventas.forEach((v,i)=>v.num=1001+i);
  const gastos=[];
  for(let d=new Date(start);dayKey(d)<=today;d.setDate(d.getDate()+1)){
    const mk=(c,cat,m,met)=>gastos.push({id:uid(),fecha:new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,30).toISOString(),concepto:c,categoria:cat,monto:m,metodo:met});
    if(d.getDate()===5)mk('Alquiler del local','Alquiler',450000,'transferencia');
    if(d.getDate()===10)mk('Internet','Servicios',22000,'transferencia');
    if(d.getDate()===12)mk('Luz','Servicios',38000,'transferencia');
    if(d.getDay()===1)mk('Navajas, toallas y talco','Insumos',15000+Math.floor(rnd()*15)*1000,'efectivo');
    if(d.getDay()===4&&d.getDate()%2===0)mk('Limpieza','Limpieza',12000,'efectivo');
  }
  const compras=[
    {id:uid(),num:43,fecha:new Date(now.getTime()-35*864e5).toISOString(),proveedor:'Distribuidora Capilar SRL',productoId:'p1',cant:20,costo:6000,estado:'pagada'},
    {id:uid(),num:44,fecha:new Date(now.getTime()-12*864e5).toISOString(),proveedor:'Barber Supply',productoId:'p3',cant:12,costo:6500,estado:'pagada'},
    {id:uid(),num:45,fecha:new Date(now.getTime()-2*864e5).toISOString(),proveedor:'Distribuidora Capilar SRL',productoId:'p2',cant:10,costo:7500,estado:'pendiente'}];
  const ap=new Date(now);ap.setHours(9,0,0,0);
  const cierres=[];
  for(let i=1,k=0;k<6;i++){const d=new Date(now.getTime()-i*864e5);if(d.getDay()===0)continue;k++;
    const esp=60000+Math.floor(rnd()*40)*5000;const dif=k===3?-2000:0;d.setHours(21,0,0,0);
    cierres.push({id:uid(),fecha:d.toISOString(),apertura:50000,esperado:esp,contado:esp+dif,dif})}
  const caja={abierta:true,apertura:{fecha:ap.toISOString(),monto:50000,por:'Darwin'},cierres};
  const prev=monthKey(new Date(now.getFullYear(),now.getMonth()-1,1)),prev2=monthKey(new Date(now.getFullYear(),now.getMonth()-2,1));
  const pagos=[];
  [prev2,prev].forEach(mk=>usuarios.filter(u=>u.rol==='barbero').forEach(u=>{
    const vs=ventas.filter(v=>v.barberoId===u.id&&monthKey(v.fecha)===mk);const tot=sum(vs,v=>v.comision);
    const [y,m]=mk.split('-').map(Number);
    pagos.push({id:uid(),mes:mk,barberoId:u.id,bruto:tot,descontado:0,monto:tot,servicios:vs.length,fecha:new Date(y,m,1,19).toISOString()});
  }));
  return {settings,servicios,productos,planes,usuarios,clientes,ventas,gastos,compras,caja,pagos,demo:true,session:null};
}
function calcComision(items,pct,pctProd,rol){
  if(rol==='admin')return 0;
  return Math.round(sum(items.filter(x=>x.tipo==='servicio'),x=>x.precio*x.cant)*pct/100+sum(items.filter(x=>x.tipo==='producto'),x=>x.precio*x.cant)*pctProd/100);
}

function niceMax(v){const p=10**Math.floor(Math.log10(v));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function lineChart(series,labels){
  const W=640,H=220,L=50,R=14,T=12,B=26;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));
  const x=i=>L+(W-L-R)*i/Math.max(1,labels.length-1),y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`}
  labels.forEach((l,i)=>{if(i%5===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if(s.area)g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(s.vals.length-1)},${y(0)}" fill="${s.color}" opacity=".10"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    const li=s.vals.length-1;g+=`<circle cx="${x(li)}" cy="${y(s.vals[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ventas diarias">${g}</svg></div>`;
}
function donut(parts){
  const tot=sum(parts,p=>p.value)||1,r=52,Cf=2*Math.PI*r;let acc=0,g='';
  parts.forEach(p=>{const len=p.value/tot*Cf;g+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${len} ${Cf-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len});
  return `<div class="donutwrap"><svg viewBox="0 0 140 140" role="img" aria-label="Ventas por categoría">${g}</svg>
  <div class="legend">${parts.map(p=>`<div><span><i style="background:${p.color}"></i>${p.label}</span><b class="num">${Math.round(p.value/tot*100)}%</b></div>`).join('')}</div></div>`;
}
function qrSvg(text,cell){
  try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(cell||4,0)}catch(e){return `<div class="mono" style="font-size:11px;text-align:center">${esc(text)}</div>`}
}

function cajaHoy(){
  const ef=S.ventas.filter(v=>v.metodo==='efectivo'&&v.estado==='entregado'&&v.entregadoEn&&isToday(v.entregadoEn));
  const gas=S.gastos.filter(g=>g.metodo==='efectivo'&&isToday(g.fecha));
  const pag=S.pagos.filter(p=>isToday(p.fecha));
  const ap=S.caja.abierta?S.caja.apertura.monto:0;
  return {ef,gas,pag,ap,total:ap+sum(ef,cobrado)-sum(gas,g=>g.monto)-sum(pag,p=>p.monto)};
}

  <div class="head"><div><h1>¡Bienvenido, ${esc(me().nombre)}!</h1><p class="sub">Así viene el negocio hoy.</p></div><button class="btn gold" data-a="nuevaVenta">${I.plus}Nueva venta</button></div>
  <div class="grid kpis">

    ${kpi('Ganancia del día',fmt(gan),'chart','gold',delta(gan,ganAy)||'después de comisiones y gastos')}
    ${kpi('Clientes atendidos',cli,'clientes','blue',`<span class="${cli>=cliAy?'up':'down'}">${cli>=cliAy?'↑':'↓'} ${Math.abs(cli-cliAy)}</span> vs ayer`)}
    ${kpi('Caja disponible',fmt(caja.total),'caja','gold','efectivo en el local')}
    ${kpi('Gastos del día',fmt(gastosHoy),'gastos','bad',S.gastos.filter(g=>isToday(g.fecha)).map(g=>esc(g.concepto)).join(', ')||'sin gastos')}
  </div>
  ${pend||manoTot||low.length?`<div class="grid g3">
    ${manoTot?`<div class="card" style="border-color:var(--warn)"><div class="row"><span class="pill warn">Para cobrar</span></div><div><b class="num">${fmt(manoTot)}</b> en efectivo lo tienen los barberos todavía.</div><button class="btn sm" style="align-self:flex-start" data-a="go" data-v="caja">Ir a caja</button></div>`:''}

    ${low.length?`<div class="card" style="border-color:var(--bad)"><div><span class="pill bad">Stock bajo</span></div><div>${low.map(p=>esc(p.nombre)+' ('+p.stock+')').join(', ')}</div><button class="btn sm" style="align-self:flex-start" data-a="go" data-v="inventario">Ver inventario</button></div>`:''}

function clientesList(){

const monthNav=(mk,cur)=>`<div class="monthnav"><button class="btn sm" data-a="mes" data-d="-1" aria-label="Mes anterior">‹</button><b>${monthName(mk)}</b><button class="btn sm" data-a="mes" data-d="1" aria-label="Mes siguiente" ${mk>=cur?'disabled style="opacity:.35"':''}>›</button></div>`;

function liq(u,mk){
  const vs=S.ventas.filter(v=>v.barberoId===u.id&&monthKey(v.fecha)===mk);
  const comSvc=Math.round(sum(vs,v=>sum(svcItems(v),x=>x.precio*x.cant))*u.comision/100);
  const total=sum(vs,v=>v.comision);
  const mano=enMano(u.id),sumMano=sum(mano,cobrado);
  return {vs,servicios:sum(vs,v=>svcItems(v).length),prods:sum(vs,v=>sum(v.items.filter(x=>x.tipo==='producto'),x=>x.cant)),comSvc,comProd:total-comSvc,total,mano,sumMano,pago:S.pagos.find(p=>p.mes===mk&&p.barberoId===u.id)};
}
function vLiq(){
  const mk=ui.mes,cur=monthKey(new Date());
  const items=S.usuarios.filter(u=>u.rol==='barbero').map(u=>({u,...liq(u,mk)}));
  const vm=S.ventas.filter(v=>monthKey(v.fecha)===mk);
  const ing=sum(vm,cobrado),com=sum(vm,v=>v.comision),gas=sum(S.gastos.filter(g=>monthKey(g.fecha)===mk),g=>g.monto),compr=sum(S.compras.filter(c=>monthKey(c.fecha)===mk),c=>c.cant*c.costo);
  return `${demoNote()}
  <div class="head"><div><h1>Fin de mes</h1><p class="sub">${mk===cur?'El mes está en curso. Podés pagar cuando cierre.':'Liquidación de comisiones'}</p></div>${monthNav(mk,cur)}</div>
  <div class="grid g3">${items.map(x=>`<div class="card">
    <div class="li" style="padding:0;border:0"><span class="avatar">${initials(x.u.nombre)}</span><div class="grow"><div class="name">${esc(x.u.nombre)}</div><div class="small">${x.servicios} servicios · ${x.prods} productos</div></div>
      ${x.pago?`<span class="pill ok">Pagado ${fdate(x.pago.fecha)}</span>`:'<span class="pill warn">Sin pagar</span>'}</div>
    <div class="ledger">
      <span>Servicios (${x.u.comision}%)</span><span class="r">${fmt(x.comSvc)}</span>
      <span>Productos (${S.settings.comisionProducto}%)</span><span class="r">${fmt(x.comProd)}</span>
      ${x.pago&&x.pago.descontado?`<span>Efectivo que tenía, descontado</span><span class="r">−${fmt(x.pago.descontado)}</span>`:''}
      ${!x.pago&&x.sumMano?`<span style="color:var(--warn)">Efectivo sin entregar</span><span class="r" style="color:var(--warn)">${fmt(x.sumMano)}</span>`:''}
      <span class="tot">${x.pago?'Pagado':'A pagar'}</span><span class="r tot">${fmt(x.pago?x.pago.monto:x.total)}</span>
    </div>
    ${!x.pago&&x.vs.length?`<button class="btn dark" data-a="pagar" data-id="${x.u.id}">Pagar a ${esc(x.u.nombre)}</button>`:''}
  </div>`).join('')}</div>
  <div class="card"><h2>Resultado del mes</h2><div class="ledger">
    <span>Total cobrado</span><span class="r">${fmt(ing)}</span>
    <span>Comisiones a barberos</span><span class="r">−${fmt(com)}</span>
    <span>Gastos</span><span class="r">−${fmt(gas)}</span>
    <span>Compras de mercadería</span><span class="r">−${fmt(compr)}</span>
    <span class="tot">Queda para la barbería</span><span class="r tot">${fmt(ing-com-gas-compr)}</span>
  </div></div>`;
}

function vImpuestos(){
  const now=new Date();
  const months=[];for(let i=11;i>=0;i--)months.push(monthKey(new Date(now.getFullYear(),now.getMonth()-i,1)));
  const rows=months.map(mk=>{const vs=S.ventas.filter(v=>monthKey(v.fecha)===mk);return {mk,ef:sum(vs.filter(v=>v.metodo==='efectivo'),cobrado),tr:sum(vs.filter(v=>v.metodo==='transferencia'),cobrado)}});
  const tot=sum(rows,r=>r.ef+r.tr),totTr=sum(rows,r=>r.tr),tope=S.settings.topeAnual||0;
  const max=Math.max(1,...rows.map(r=>r.ef+r.tr));
  const pagosB=sum(S.pagos.filter(p=>months.includes(p.mes)),p=>p.monto);
  return `${demoNote()}
  <div class="head"><div><h1>Impuestos</h1><p class="sub">Para controlar la categoría y llevarle los números al contador</p></div><button class="btn" data-a="copiarFiscal">Copiar resumen para el contador</button></div>
  <div class="grid kpis">
    ${kpi('Facturación últimos 12 meses',fmt(tot),'chart','gold','con los datos cargados en la app')}
    ${kpi('Por transferencia (bancarizado)',fmt(totTr),'ventas','blue',Math.round(totTr/(tot||1)*100)+'% del total')}
    ${kpi('En efectivo',fmt(tot-totTr),'money','ok')}
    ${kpi('Pagado a barberos',fmt(pagosB),'barberos','warn','en efectivo, sin factura')}
  </div>
  <div class="card"><div class="card-h"><h2>Tope de tu categoría</h2><span class="small">${tope?fmt(tope)+' (cambialo en Configuración)':'Cargalo en Configuración'}</span></div>
    ${tope?`<div class="meter ${tot/tope>.85?'low':''}" style="height:14px"><i style="width:${Math.min(100,tot/tope*100)}%"></i></div><div class="small">Usaste el <b class="num" style="color:var(--ink)">${(tot/tope*100).toFixed(1)}%</b> del tope anual. El valor que viene cargado es de ejemplo: pedile a tu contador el de tu categoría.</div>`:''}</div>
  <div class="card"><h2>Ingresos por mes</h2>
    <div class="bars" style="height:110px">${rows.map((r,i)=>`<i class="${i===11?'on':''}" style="height:${(r.ef+r.tr)/max*100}%" title="${monthName(r.mk)}: ${fmt(r.ef+r.tr)}"></i>`).join('')}</div>
    <div class="tablewrap"><table><thead><tr><th>Mes</th><th class="r">Efectivo</th><th class="r">Transferencia</th><th class="r">Total</th></tr></thead><tbody>
    ${rows.filter(r=>r.ef+r.tr>0).reverse().map(r=>`<tr><td style="text-transform:capitalize">${monthName(r.mk)}</td><td class="r mono">${fmt(r.ef)}</td><td class="r mono">${fmt(r.tr)}</td><td class="r mono"><b>${fmt(r.ef+r.tr)}</b></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="note"><b>Para charlar con el contador.</b> La app no presenta nada ante el fisco; deja los números ordenados.
    <ul><li>Las transferencias quedan registradas en el banco o la billetera virtual. El efectivo no, pero también es ingreso y suma para la categoría.</li>
    <li>Si sos monotributista, lo que importa es no pasarte del tope anual de tu categoría. Si sos responsable inscripto, además hay que liquidar IVA y la app necesitaría otra sección.</li>
    <li>Los pagos en efectivo a los barberos no tienen respaldo. Lo más prolijo es que cada barbero sea monotributista y te facture, o como mínimo firmar un recibo en cada pago.</li>
    <li>Preguntá si está permitido cobrar recargo por pagar con transferencia.</li></ul></div>`;
}

function vBNumeros(){

  const prods=sum(vs,v=>sum(v.items.filter(x=>x.tipo==='producto'),x=>x.cant));
  const comSvc=Math.round(sum(vs,v=>sum(svcItems(v),x=>x.precio*x.cant))*u.comision/100),com=sum(vs,v=>v.comision);

    <span>Clientes con membresía</span><span class="r">${memb}</span>

    <span class="tot">Pago de ${MESES[now.getMonth()]}</span><span class="r tot">${pago?'Pagado':'A fin de mes'}</span>

  ${prev.length?`<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Pagos que recibiste</span>${prev.map(p=>`<div class="card" style="padding:12px 14px"><div class="li" style="padding:0;border:0"><div class="grow"><div class="name" style="text-transform:capitalize">${monthName(p.mes)}</div><div class="small">${p.servicios} ventas · pagado el ${fdate(p.fecha)}</div></div><span class="amt">${fmt(p.monto)}</span></div></div>`).join('')}</div>`:''}`;

/* ================= HOJAS ================= */
function precioVenta(s){
  const svc=s.svc&&S.servicios.find(x=>x.id===s.svc);
  const cl=s.clienteId&&C(s.clienteId),pl=cl&&cl.planId&&PL(cl.planId);
  const puedeCubrir=!!(svc&&pl&&pl.servicioId===svc.id&&cl.usos>0&&new Date(cl.vence)>=new Date());
  const cub=puedeCubrir&&s.usarPlan;
  const prods=Object.entries(s.prods||{}).filter(([,n])=>n>0).map(([id,n])=>({p:P(id),n}));
  const base=(svc&&!cub?svc.precio:0)+sum(prods,x=>x.p.precio*x.n);
  const recargo=s.metodo==='transferencia'?Math.round(base*S.settings.recargoPct/100):0;
  return {svc,cl,pl,puedeCubrir,cub,prods,base,recargo};
}

  return `<div><h1>${admin?'Nueva venta':'Anotar corte'}</h1><p class="sub">Papelito Nº${nextNum()}${admin?'':' · '+esc(u.nombre)}</p></div>

  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Servicio</span>
    <div class="opt">${S.servicios.map(v=>`<button aria-pressed="${s.svc===v.id}" data-a="vsvc" data-id="${v.id}"><span class="k">${esc(v.nombre)}</span><span class="p">${fmt(v.precio)}</span></button>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Cliente</span>
    ${x.cl?`<div class="card" style="padding:12px;box-shadow:none"><div class="li" style="padding:0;border:0"><div class="mini-qr" style="width:44px;height:44px">${qrSvg(x.cl.codigo,1)}</div><div class="grow"><div class="name">${esc(x.cl.nombre)}</div><div class="small">${x.pl?esc(x.pl.nombre)+' · '+x.cl.usos+' usos':'Sin membresía'}</div></div><button class="btn sm ghost" data-a="vcli" data-id="">Quitar</button></div>
      ${x.puedeCubrir?`<label class="check" style="margin-top:4px"><input type="checkbox" data-a="usarPlan" ${s.usarPlan?'checked':''}><span><b>Usar la membresía</b><br><span class="small">Descuenta 1 uso. Le quedan ${x.cl.usos-(s.usarPlan?1:0)}.</span></span></label>`:x.pl&&x.svc?`<span class="small" style="color:var(--warn)">${x.cl.usos<=0||new Date(x.cl.vence)<new Date()?'La membresía no tiene usos disponibles.':'Su plan no cubre este servicio.'}</span>`:''}</div>`
    :`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="scan">${I.qr}Escanear QR</button><span class="small" style="align-self:center">Opcional. Para socios con membresía.</span></div>
      ${s.scan?`<div class="scanner"><p>Simulación de la cámara: tocá el QR que te muestra el cliente.</p><div class="vf">${socios.map(c=>`<button data-a="vcli" data-id="${c.id}"><span class="mini-qr" style="width:56px;height:56px">${qrSvg(c.codigo,1)}</span>${esc(c.nombre.split(' ')[0])}</button>`).join('')}</div></div>`:''}`}

}

  const sess=S.session;
  document.body.className=!sess?'':sess.rol==='admin'?'admin':sess.rol==='barbero'?'barbero':'';

let toastT;
function toast(m){$('#toast').innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').innerHTML='',2400)}
function login(u){S.session={uid:u.id,rol:u.rol};ui.loginErr='';ui.view='inicio';ui.btab='hoy';ui.mes=monthKey(new Date())}

/* ---------- Acciones ---------- */
const A={
  quick:el=>login(U(el.dataset.id)),
  quickC:el=>{S.session={rol:'cliente',cid:el.dataset.id}},
  loginMode:()=>{ui.loginMode=ui.loginMode==='cliente'?'equipo':'cliente';ui.loginErr=''},
  logout:()=>{S.session=null;sheet=null;ui.drawer=false},
  go:el=>{ui.view=el.dataset.v;ui.drawer=false;ui.mes=monthKey(new Date());window.scrollTo(0,0)},
  drawer:()=>{ui.drawer=!ui.drawer},
  btab:el=>{ui.btab=el.dataset.k;window.scrollTo(0,0)},
  periodo:el=>{ui.periodo=el.dataset.k},
  vfiltro:el=>{ui.vfiltro=el.dataset.k},
  vbarbero:el=>{ui.vbarbero=el.dataset.k},
  mes:el=>{const [y,m]=ui.mes.split('-').map(Number);const d=new Date(y,m-1+Number(el.dataset.d),1);if(monthKey(d)<=monthKey(new Date()))ui.mes=monthKey(d)},
  cerrar:()=>{sheet=null},
  nuevaVenta:()=>{sheet={type:'venta',barberoId:me().id,svc:'corte',prods:{},metodo:null,visto:false,usarPlan:true,clienteId:null,scan:false}},
  vsvc:el=>{sheet.svc=sheet.svc===el.dataset.id?null:el.dataset.id},
  vprod:el=>{const p=sheet.prods;p[el.dataset.id]=Math.max(0,(p[el.dataset.id]||0)+Number(el.dataset.d))},
  vmet:el=>{sheet.metodo=el.dataset.m},
  scan:()=>{sheet.scan=!sheet.scan},
  vcli:el=>{sheet.clienteId=el.dataset.id||null;sheet.scan=false;sheet.usarPlan=true;if(el.dataset.id)toast('QR leído: '+C(el.dataset.id).nombre)},
  guardarVenta:()=>{
    const s=sheet,x=precioVenta(s),b=U(s.barberoId);
    const items=[];
    if(x.svc)items.push({tipo:'servicio',refId:x.svc.id,nombre:x.svc.nombre,precio:x.svc.precio,cant:1,cubierto:x.cub});
    x.prods.forEach(({p,n})=>{items.push({tipo:'producto',refId:p.id,nombre:p.nombre,precio:p.precio,cant:n});p.stock-=n});
    if(x.cub)x.cl.usos--;
    const metodo=x.base===0?'membresia':s.metodo,adm=me().rol==='admin'||b.rol==='admin';
    const v={id:uid(),num:nextNum(),fecha:new Date().toISOString(),barberoId:b.id,clienteId:x.cl?x.cl.id:null,items,metodo,recargo:x.recargo,
      estado:metodo==='membresia'?'cubierto':metodo==='transferencia'?'pendiente':adm?'entregado':'en_barbero',entregadoEn:metodo==='efectivo'&&adm?new Date().toISOString():null,
      comision:calcComision(items,b.comision,S.settings.comisionProducto,b.rol)};
    S.ventas.push(v);sheet={type:'listo',venta:v};
  },
  verificar:el=>{const v=S.ventas.find(x=>x.id===el.dataset.id);if(v){v.estado='verificado';toast('Nº'+v.num+': transferencia acreditada')}},
  recibir:el=>{sheet={type:'recibir',id:el.dataset.id}},
  confirmarRecibir:()=>{const l=enMano(sheet.id),t=sum(l,cobrado),now=new Date().toISOString();l.forEach(v=>{v.estado='entregado';v.entregadoEn=now});toast('Recibiste '+fmt(t)+' de '+U(sheet.id).nombre);sheet=null},
  pagar:el=>{sheet={type:'pagar',id:el.dataset.id,descontar:true}},
  confirmarPago:()=>{const u=U(sheet.id),x=liq(u,ui.mes),desc=sheet.descontar?x.sumMano:0,now=new Date().toISOString();
    if(desc)x.mano.forEach(v=>{v.estado='entregado';v.entregadoEn=now});
    S.pagos.push({id:uid(),mes:ui.mes,barberoId:u.id,bruto:x.total,descontado:desc,monto:x.total-desc,servicios:x.vs.length,fecha:now});toast('Pago a '+u.nombre+' registrado');sheet=null},
  tarjeta:el=>{sheet={type:'tarjeta',id:el.dataset.id}},
  venderPlan:el=>{const c=C(el.dataset.id);sheet={type:'venderPlan',id:c.id,planId:c.planId||S.planes[0].id,metodo:null}},
  selPlan:el=>{sheet.planId=el.dataset.id},
  selMet:el=>{sheet.metodo=el.dataset.m},
  confirmarPlan:()=>{const c=C(sheet.id),pl=PL(sheet.planId),tr=sheet.metodo==='transferencia',now=new Date();
    c.planId=pl.id;c.usos=pl.usos;c.vence=new Date(now.getTime()+30*864e5).toISOString();
    S.ventas.push({id:uid(),num:nextNum(),fecha:now.toISOString(),barberoId:me().id,clienteId:c.id,items:[{tipo:'plan',refId:pl.id,nombre:'Plan '+pl.nombre,precio:pl.precio,cant:1}],
      metodo:sheet.metodo,recargo:tr?Math.round(pl.precio*S.settings.recargoPct/100):0,estado:tr?'pendiente':'entregado',entregadoEn:tr?null:now.toISOString(),comision:0});
    sheet={type:'tarjeta',id:c.id};toast(c.nombre+' es socio hasta el '+fdate(c.vence))},
  editCliente:()=>{sheet={type:'cliente',nombre:'',tel:''}},
  guardarCliente:()=>{if(!sheet.nombre.trim()){toast('Escribí el nombre del cliente');return true}
    const n=S.clientes.length,c={id:'c'+uid(),nombre:sheet.nombre.trim(),tel:sheet.tel.trim(),codigo:'SOC-'+(1040+n*7+Math.floor(Math.random()*5)),planId:null,usos:0,vence:null,alta:new Date().toISOString()};
    S.clientes.push(c);sheet={type:'tarjeta',id:c.id};toast('Cliente creado con código '+c.codigo)},
  editBarbero:el=>{const u=el.dataset.id&&U(el.dataset.id);sheet=u?{type:'barbero',...u}:{type:'barbero',id:null,nombre:'',usuario:'',pin:'',comision:50,rol:'barbero',activo:true}},
  guardarBarbero:()=>{const s=sheet;if(!s.nombre||!s.usuario||!s.pin){toast('Completá nombre, usuario y PIN');return true}
    if(S.usuarios.some(u=>u.usuario===s.usuario.toLowerCase()&&u.id!==s.id)){toast('Ese usuario ya existe');return true}
    const data={nombre:s.nombre.trim(),usuario:s.usuario.trim().toLowerCase(),pin:String(s.pin),comision:Number(s.comision)||0,activo:s.activo!==false};
    if(s.id)Object.assign(U(s.id),data);else S.usuarios.push({id:'u'+uid(),rol:'barbero',...data});toast('Guardado');sheet=null},
  editProducto:el=>{const p=el.dataset.id&&P(el.dataset.id);sheet=p?{type:'producto',...p}:{type:'producto',id:null,nombre:'',precio:'',costo:'',stock:'',min:3}},
  guardarProducto:()=>{const s=sheet;if(!s.nombre){toast('Escribí el nombre del producto');return true}
    const data={nombre:s.nombre,precio:+s.precio||0,costo:+s.costo||0,stock:+s.stock||0,min:+s.min||0};
    if(s.id)Object.assign(P(s.id),data);else S.productos.push({id:'p'+uid(),...data});toast('Producto guardado');sheet=null},
  nuevaCompra:el=>{const p=P(el.dataset.id)||S.productos[0];sheet={type:'compra',productoId:p.id,proveedor:'',cant:10,costo:p.costo,pagada:true}},
  guardarCompra:()=>{const s=sheet,p=P(s.productoId),cant=+s.cant||0;if(!cant){toast('Poné una cantidad');return true}
    p.stock+=cant;p.costo=+s.costo||p.costo;
    S.compras.push({id:uid(),num:Math.max(0,...S.compras.map(c=>c.num))+1,fecha:new Date().toISOString(),proveedor:s.proveedor||'Sin proveedor',productoId:p.id,cant,costo:+s.costo||0,estado:s.pagada?'pagada':'pendiente'});
    toast(p.nombre+': stock '+p.stock);sheet=null},
  pagarCompra:el=>{S.compras.find(c=>c.id===el.dataset.id).estado='pagada';toast('Compra pagada')},
  nuevoGasto:()=>{sheet={type:'gasto',concepto:'',categoria:'Insumos',monto:'',metodo:'efectivo'}},
  guardarGasto:()=>{const s=sheet;if(!s.concepto||!+s.monto){toast('Completá concepto y monto');return true}
    S.gastos.push({id:uid(),fecha:new Date().toISOString(),concepto:s.concepto,categoria:s.categoria,monto:+s.monto,metodo:s.metodo});ui.mes=monthKey(new Date());toast('Gasto guardado');sheet=null},
  abrirCaja:()=>{sheet={type:'abrirCaja',monto:50000}},
  confirmarAbrir:()=>{S.caja.abierta=true;S.caja.apertura={fecha:new Date().toISOString(),monto:+sheet.monto||0,por:me().nombre};toast('Caja abierta');sheet=null},
  cerrarCaja:()=>{sheet={type:'cerrarCaja',contado:''}},
  confirmarCierre:()=>{const c=cajaHoy(),cont=sheet.contado===''?c.total:+sheet.contado;
    S.caja.cierres.push({id:uid(),fecha:new Date().toISOString(),apertura:c.ap,esperado:c.total,contado:cont,dif:cont-c.total});S.caja.abierta=false;toast('Caja cerrada');sheet=null},
  copiarFiscal:()=>{
    const now=new Date(),lines=['Resumen '+S.settings.negocio,''];
    for(let i=11;i>=0;i--){const mk=monthKey(new Date(now.getFullYear(),now.getMonth()-i,1));const vs=S.ventas.filter(v=>monthKey(v.fecha)===mk);if(!vs.length)continue;
      const ef=sum(vs.filter(v=>v.metodo==='efectivo'),cobrado),tr=sum(vs.filter(v=>v.metodo==='transferencia'),cobrado);
      const pg=sum(S.pagos.filter(p=>p.mes===mk),p=>p.monto),ga=sum(S.gastos.filter(g=>monthKey(g.fecha)===mk),g=>g.monto);
      lines.push(monthName(mk)+': efectivo '+fmt(ef)+', transferencia '+fmt(tr)+', total '+fmt(ef+tr)+', gastos '+fmt(ga)+', pagos a barberos '+fmt(pg))}
    const t=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado'),()=>toast('Este navegador no deja copiar'));else toast('Este navegador no deja copiar');
    return true},
  reset:el=>{if(!el.dataset.confirm){el.dataset.confirm='1';el.textContent='Tocá de nuevo para borrar todo';return true}
    const keep=S.session;const n=seed();S={...n,ventas:[],gastos:[],compras:[],pagos:[],caja:{abierta:false,apertura:{fecha:new Date().toISOString(),monto:0,por:''},cierres:[]},clientes:[],demo:false,session:keep};
    S.productos.forEach(p=>p.stock=0);toast('Datos borrados. Usuarios y precios quedaron.')},
  reseed:()=>{const keep=S.session;S=seed();S.session=keep;toast('Ejemplos cargados')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='scrim'){if(e.target===el){sheet=null;render()}return}
  if(['visto','descontar','usarPlan','activo','compraPagada'].includes(a))return;
  if(A[a]&&A[a](el)===true)return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(sheet&&a){({visto:()=>sheet.visto=t.checked,descontar:()=>sheet.descontar=t.checked,usarPlan:()=>sheet.usarPlan=t.checked,activo:()=>sheet.activo=t.checked,compraPagada:()=>sheet.pagada=t.checked}[a]||(()=>{}))();render();return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.dataset.str?t.value:Math.max(0,Number(t.value)||0);render()}
  else if(t.dataset.svc){S.servicios.find(x=>x.id===t.dataset.svc).precio=Math.max(0,+t.value||0);render()}
  else if(t.dataset.plan){const p=PL(t.dataset.plan);p[t.dataset.f]=t.dataset.f==='nombre'?t.value:Math.max(0,+t.value||0);render()}
  else if(sheet&&t.dataset.k&&t.tagName==='SELECT'){sheet[t.dataset.k]=t.value;if(sheet.type==='compra'){sheet.costo=P(t.value).costo}render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(sheet&&t.dataset.k&&t.tagName==='INPUT'){sheet[t.dataset.k]=t.value;if(sheet.type==='cerrarCaja'){const pos=t.selectionStart;render();const i=document.getElementById('f-cont');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}}
  if(t.id==='q'){ui.q=t.value;const l=$('#clist');if(l)l.innerHTML=clientesList()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  if(ui.loginMode==='cliente'){const q=($('#l-tel').value||'').trim().toLowerCase().replace(/\s/g,'');
    const c=S.clientes.find(c=>c.codigo.toLowerCase()===q||c.tel.replace(/\s/g,'')===q);
    if(c){S.session={rol:'cliente',cid:c.id}}else ui.loginErr='No encontramos ese teléfono o código. Probá con el que te dio la barbería.';
  }else{const us=($('#l-user').value||'').trim().toLowerCase(),pin=($('#l-pin').value||'').trim();
    const u=S.usuarios.find(u=>u.usuario===us);
    if(!u||u.pin!==pin)ui.loginErr='Usuario o PIN incorrecto.';else if(u.activo===false)ui.loginErr='Tu usuario está desactivado. Hablá con Darwin.';else login(u);
  }
  render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ticket.tap')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'){if(sheet){sheet=null;render()}else if(ui.drawer){ui.drawer=false;render()}}
});
render();
})();
</script>
